apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: capk-webhook-service-cert
  name: capk-webhook-service
  namespace: '{{ default "multicluster-engine" .Values.global.namespace }}'
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    control-plane: capk-controller-manager
